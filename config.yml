# Расстояние между структурами в БЛОКАХ (примерно: по одной на квадрат такого размера).
# Больше число = реже. 0 = отключить тип.
dungeons:
  enabled: true
  # Обычный мир
  overworld-crypt: 1500     # подземный склеп
  overworld-tower: 1300     # разрушенная башня
  overworld-pavilion: 1000  # павильон с тайником под полом
  # Ад (мир в 8 раз "теснее", поэтому расстояния меньше)
  nether-bunker: 700
  nether-forge: 900
  nether-altar: 600
  # Энд (часть мест попадает в пустоту и пропускается, поэтому числа меньше)
  end-shrine: 600           # пурпурное святилище
  end-vault: 800            # комплекс "Зловещее хранилище" с ключами и спавнерами
  end-safe-radius: 110      # рядом с главным островом не строим

# Миры, которые автоматически загружаются при старте ("имя:тип", тип = normal|nether|end)
worlds: []
